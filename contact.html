<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Engineering College</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img src="assets/images/logo.svg" alt=""><span class="brand-text">Engineering College</span></a>
      <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false">☰</button>
      <nav id="main-nav" class="main-nav"><ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="departments.html">Departments</a></li>
        <li><a href="admissions.html">Admissions</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="faculty.html">Faculty</a></li>
        <li><a href="registration.html">Registration</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul></nav>
    </div>
  </header>

  <main id="main" class="site-main" tabindex="-1">
    <section class="container">
      <h1>Contact us</h1>
      <p class="lead">Questions? Reach out — we’ll reply within a few business days.</p>

      <form id="contactForm" novalidate>
        <div class="form-row">
          <label for="contactName">Name <span class="req">*</span></label>
          <input id="contactName" name="contactName" type="text" required>
        </div>

        <div class="form-row">
          <label for="contactEmail">Email <span class="req">*</span></label>
          <input id="contactEmail" name="contactEmail" type="email" required>
        </div>

        <!-- honeypot -->
        <div class="visually-hidden">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" autocomplete="off">
        </div>

        <div class="form-row">
          <label for="subject">Subject <span class="req">*</span></label>
          <input id="subject" name="subject" type="text" required>
        </div>

        <div class="form-row">
          <label for="message">Message <span class="req">*</span></label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <div class="form-row">
          <button class="btn primary" type="submit">Send message</button>
        </div>

        <div id="contactMessage" class="form-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p>© 2025 Engineering College</p></div>
  </footer>
</body>
</html>
