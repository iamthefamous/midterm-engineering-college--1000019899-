        <div class="collapse navbar-collapse" id="navbarNav">

<main class="container py-5 mt-5">
    <section>
        <h1 class="text-center mb-4">Register Now</h1>
        <p>Start your journey with Engineering College by completing the form below.</p>
        <form id="registration-form" novalidate>
            <div class="mb-3">
                <label for="full-name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full-name" required aria-describedby="full-name-error">
                <div id="full-name-error" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required aria-describedby="email-error">
                <div id="email-error" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phone" required aria-describedby="phone-error">
                <div id="phone-error" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
                <label for="program" class="form-label">Desired Program</label>
                <select class="form-select" id="program" required aria-describedby="program-error">
                    <option value="" disabled selected>Select a program</option>
                    <option value="computer">Computer Engineering</option>
                    <option value="mechanical">Mechanical Engineering</option>
                    <option value="civil">Civil Engineering</option>
                </select>
                <div id="program-error" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Study Mode</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="study-mode" id="full-time" value="full-time" required aria-describedby="study-mode-error">
                    <label class="form-check-label" for="full-time">Full-Time</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="study-mode" id="part-time" value="part-time">
                    <label class="form-check-label" for="part-time">Part-Time</label>
                </div>
                <div id="study-mode-error" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
                <label for="intake" class="form-label">Intended Intake</label>
                <input type="date" class="form-control" id="intake" required aria-describedby="intake-error">
                <div id="intake-error" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required aria-describedby="password-error">
                <div id="password-error" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm-password" required aria-describedby="confirm-password-error">
                <div id="confirm-password-error" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
                <label for="scholarship" class="form-label">Interested in Scholarships?</label>
                <select class="form-select" id="scholarship" aria-describedby="scholarship-error">
                    <option value="no">No</option>
                    <option value="yes">Yes</option>
                </select>
                <div id="scholarship-error" class="invalid-feedback"></div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required aria-describedby="terms-error">
                <label class="form-check-label" for="terms">I agree to the <a href="#">terms and policies</a></label>
                <div id="terms-error" class="invalid-feedback"></div>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
            <div id="registration-feedback" class="mt-3"></div>
        </form>
    </section>
</main>
