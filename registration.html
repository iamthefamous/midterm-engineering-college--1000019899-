<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registration — Engineering College</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img src="assets/images/logo.svg" alt=""><span class="brand-text">Engineering College</span></a>
      <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false">☰</button>
      <nav id="main-nav" class="main-nav"><ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="departments.html">Departments</a></li>
        <li><a href="admissions.html">Admissions</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="faculty.html">Faculty</a></li>
        <li><a href="registration.html" aria-current="page">Registration</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul></nav>
    </div>
  </header>

  <main id="main" class="site-main" tabindex="-1">
    <section class="container">
      <h1>Prospective Student Registration</h1>
      <p class="lead">Complete the form below to start your application. Required fields are marked with <span aria-hidden="true">*</span>.</p>

      <form id="registrationForm" class="form-grid" novalidate>
        <!-- Full Name -->
        <div class="form-row">
          <label for="fullName">Full name <span class="req">*</span></label>
          <input id="fullName" name="fullName" type="text" required aria-describedby="fullNameHelp">
          <div id="fullNameError" class="form-error" aria-live="polite"></div>
        </div>

        <!-- Email -->
        <div class="form-row">
          <label for="email">Email <span class="req">*</span></label>
          <input id="email" name="email" type="email" required>
          <div id="emailError" class="form-error" aria-live="polite"></div>
        </div>

        <!-- Phone -->
        <div class="form-row">
          <label for="phone">Phone <span class="req">*</span></label>
          <input id="phone" name="phone" type="tel" pattern="^\+?\d{7,15}$" required>
          <div id="phoneError" class="form-error" aria-live="polite"></div>
        </div>

        <!-- Desired Program -->
        <div class="form-row">
          <label for="program">Desired program <span class="req">*</span></label>
          <select id="program" name="program" required>
            <option value="">Choose a program...</option>
            <option value="cs">Computer Engineering</option>
            <option value="ee">Electrical Engineering</option>
            <option value="me">Mechanical Engineering</option>
            <option value="ce">Civil Engineering</option>
          </select>
          <div id="programError" class="form-error" aria-live="polite"></div>
        </div>

        <!-- Study Mode (radio) -->
        <fieldset class="form-row">
          <legend>Study mode <span class="req">*</span></legend>
          <div class="form-radio">
            <input id="studyFull" name="studyMode" type="radio" value="full" required>
            <label for="studyFull">Full-time</label>
          </div>
          <div class="form-radio">
            <input id="studyPart" name="studyMode" type="radio" value="part">
            <label for="studyPart">Part-time</label>
          </div>
          <div id="studyModeError" class="form-error" aria-live="polite"></div>
        </fieldset>

        <!-- Intended Intake -->
        <div class="form-row">
          <label for="intakeDate">Intended intake <span class="req">*</span></label>
          <input id="intakeDate" name="intakeDate" type="date" required>
          <div id="intakeDateError" class="form-error" aria-live="polite"></div>
        </div>

        <!-- Password / Confirm -->
        <div class="form-row">
          <label for="password">Password <span class="req">*</span></label>
          <input id="password" name="password" type="password" minlength="8" required>
          <div id="passwordError" class="form-error" aria-live="polite"></div>
        </div>

        <div class="form-row">
          <label for="confirmPassword">Confirm password <span class="req">*</span></label>
          <input id="confirmPassword" name="confirmPassword" type="password" required>
          <div id="confirmPasswordError" class="form-error" aria-live="polite"></div>
        </div>

        <!-- Optional field -->
        <div class="form-row">
          <label for="scholarship">Scholarship interest (optional)</label>
          <input id="scholarship" name="scholarship" type="text" placeholder="e.g. Merit-based scholarship">
        </div>

        <!-- Agree policy -->
        <div class="form-row">
          <div class="form-check">
            <input id="policyAgree" type="checkbox" required>
            <label for="policyAgree">I agree to the <a href="policy.html">privacy &amp; terms</a> <span class="req">*</span></label>
            <div id="policyError" class="form-error" aria-live="polite"></div>
          </div>
        </div>

        <div class="form-row">
          <button id="submitBtn" class="btn primary" type="submit" disabled>Submit application</button>
        </div>

        <div id="formMessage" class="form-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p>© 2025 Engineering College</p></div>
  </footer>
</body>
</html>
